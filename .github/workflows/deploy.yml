name: CI/CD - Build to ECR and Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
  BACKEND_REPO: myapp-backend
  FRONTEND_REPO: myapp-frontend

jobs:
  check:
    name: Check ${{ matrix.app }} builds
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - name: Get the code
        uses: actions/checkout@v4
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - name: Install packages
        run: npm ci
      - name: Build
        run: npm run build

  build-and-push:
    name: Build and push images to ECR
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4
      - name: Log in to AWS (OIDC, temporary credentials)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPO }}:latest
            ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPO }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPO }}:latest
            ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPO }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy to ${{ matrix.host }}
    needs: build-and-push
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        host: [EC2_HOST_1, EC2_HOST_2]
    steps:
      - name: Get the code
        uses: actions/checkout@v4
      - name: Copy docker-compose.prod.yml to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets[matrix.host] }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.prod.yml
          target: /home/ubuntu/app
      - name: Pull new images, restart, health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets[matrix.host] }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/app

            echo "==> Writing .env from GitHub secrets"
            cat > .env <<'EOF'
            IMAGE_TAG=${{ github.sha }}
            ECR_REGISTRY=${{ env.ECR_REGISTRY }}
            NODE_ENV=production
            PORT=5000
            MONGO_URI=${{ secrets.MONGO_URI }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            AWS_REGION=${{ env.AWS_REGION }}
            S3_BUCKET=${{ vars.S3_BUCKET }}
            EOF
            sed -i 's/^[ \t]*//' .env
            chmod 600 .env

            echo "==> Logging in to ECR (using the server's IAM role)"
            aws ecr get-login-password --region ${{ env.AWS_REGION }} \
              | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

            echo "==> Pulling new images"
            docker compose -f docker-compose.prod.yml pull

            echo "==> Starting containers"
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "==> Removing old images"
            docker image prune -af --filter "until=24h" || true

            echo "==> Health check"
            for i in $(seq 1 20); do
              if curl -fs http://localhost/api/health; then
                echo ""
                echo "==> Healthy!"
                exit 0
              fi
              echo "Waiting for app... ($i/20)"
              sleep 3
            done

            echo "==> App did not become healthy. Last logs:"
            docker compose -f docker-compose.prod.yml logs --tail=50 backend
            exit 1

